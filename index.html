<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f5ef">
  <title>Create an account</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1d302d;
      --muted: #60716d;
      --line: #d7dfd9;
      --paper: #fffefa;
      --canvas: #f3f5ef;
      --green: #24594e;
      --green-dark: #193f38;
      --lime: #d5e881;
      --error: #a63e36;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 18px;
      color: var(--ink);
      background-color: var(--canvas);
      background-image: radial-gradient(#cbd5cb 0.7px, transparent 0.7px);
      background-size: 18px 18px;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }

    .page {
      width: min(100%, 960px);
      min-height: 590px;
      display: grid;
      grid-template-columns: 0.82fr 1.18fr;
      overflow: hidden;
      background: var(--paper);
      border: 1px solid #e4e9e2;
      border-radius: 10px;
      box-shadow: 0 24px 70px #26443a1a;
    }

    .intro {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 38px;
      color: #f7f8ed;
      background: var(--green-dark);
    }

    .mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      color: var(--green-dark);
      background: var(--lime);
      border-radius: 50%;
      font-size: 20px;
      font-weight: 700;
    }

    .intro-copy { margin: auto 0; }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--lime);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.4px;
      text-transform: uppercase;
    }

    h1, h2, p { margin-top: 0; }

    h1 {
      max-width: 330px;
      margin-bottom: 16px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 42px;
      font-weight: 400;
      line-height: 1.06;
    }

    .intro-copy p:last-child {
      max-width: 290px;
      margin-bottom: 0;
      color: #c6d4ce;
      font-size: 15px;
      line-height: 1.65;
    }

    .intro-note {
      margin: 0;
      color: #c6d4ce;
      font-size: 12px;
    }

    .form-panel { padding: 42px clamp(24px, 6vw, 58px); }

    h2 {
      margin-bottom: 8px;
      font-size: 24px;
      font-weight: 700;
    }

    .form-hint {
      margin-bottom: 28px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px 14px;
    }

    .field { min-width: 0; }
    .field-wide { grid-column: 1 / -1; }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 700;
    }

    input {
      width: 100%;
      height: 46px;
      padding: 0 12px;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 5px;
      font: inherit;
      font-size: 14px;
    }

    input::placeholder { color: #9aa8a2; }
    input:focus-visible { outline: 3px solid #b5d7ca; outline-offset: 1px; border-color: var(--green); }

    .terms {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 22px 0 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .terms input {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
      margin: 1px 0 0;
      accent-color: var(--green);
    }

    .terms label { margin: 0; font-weight: 400; }

    button {
      width: 100%;
      min-height: 48px;
      color: white;
      background: var(--green);
      border: 0;
      border-radius: 5px;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: var(--green-dark); }
    button:focus-visible { outline: 3px solid #b5d7ca; outline-offset: 3px; }

    .status {
      min-height: 20px;
      margin: 12px 0 0;
      color: var(--green-dark);
      font-size: 13px;
      line-height: 1.5;
    }

    @media (max-width: 680px) {
      body { display: block; padding: 14px; }
      .page { grid-template-columns: 1fr; }
      .intro { min-height: 220px; padding: 24px; }
      .intro-copy { margin: 24px 0 18px; }
      h1 { font-size: 34px; }
      .intro-note { display: none; }
      .form-panel { padding: 30px 24px; }
    }

    @media (max-width: 420px) {
      .fields { grid-template-columns: 1fr; }
      .field-wide { grid-column: auto; }
    }
  </style>
</head>
<body>
  <main class="page">
    <aside class="intro" aria-label="Welcome">
      <div class="mark" aria-hidden="true">+</div>
      <div class="intro-copy">
        <p class="eyebrow">A good place to begin</p>
        <h1>Make room for what’s next.</h1>
        <p>Create your account to get started. It only takes a moment.</p>
      </div>
      <p class="intro-note">Registration form demo · Your details stay in this browser</p>
    </aside>

    <section class="form-panel" aria-labelledby="form-title">
      <h2 id="form-title">Create your account</h2>
      <p class="form-hint">Enter your details below to get started.</p>

      <form id="registration-form">
        <div class="fields">
          <div class="field">
            <label for="first-name">First name</label>
            <input id="first-name" name="firstName" type="text" autocomplete="given-name" placeholder="Alex" required>
          </div>
          <div class="field">
            <label for="last-name">Last name</label>
            <input id="last-name" name="lastName" type="text" autocomplete="family-name" placeholder="Morgan" required>
          </div>
          <div class="field field-wide">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="alex@example.com" required>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required>
          </div>
          <div class="field">
            <label for="confirm-password">Confirm password</label>
            <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Enter it again" required>
          </div>
        </div>

        <div class="terms">
          <input id="terms" name="terms" type="checkbox" required>
          <label for="terms">I agree to the terms and acknowledge the privacy notice.</label>
        </div>

        <button type="submit">Create account</button>
        <p class="status" id="form-status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script>
    const form = document.querySelector("#registration-form");
    const password = document.querySelector("#password");
    const confirmPassword = document.querySelector("#confirm-password");
    const status = document.querySelector("#form-status");

    function validatePasswordMatch() {
      confirmPassword.setCustomValidity(
        confirmPassword.value && confirmPassword.value !== password.value
          ? "Passwords do not match."
          : ""
      );
    }

    password.addEventListener("input", validatePasswordMatch);
    confirmPassword.addEventListener("input", validatePasswordMatch);

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      validatePasswordMatch();
      if (!form.reportValidity()) return;
      status.textContent = "Details validated. This demo does not send or store your information.";
    });
  </script>
</body>
</html>
